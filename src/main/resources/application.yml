spring:
  application:
    name: PaymentGateway

  profiles:
    active: local

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      timeout: 2000ms

  h2:
    console:
      enabled: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

payment:
  gateways:
    default-gateway: PAYCHANGU
    onekhusa:
      enabled: false
      environment: sandbox
      base-url: ${ONEKHUSA_BASE_URL:https://api.onekhusa.com/sandbox/v1}
      api-key: ${ONEKHUSA_API_KEY:sandbox_1y9pto5RSBykdybCJnanXgvm1Rg4SiXGmg}
      api-secret: ${ONEKHUSA_API_SECRET:xTEPvKNebsyjS7DlZa0_7qatm54ptmHEEOwravK3igYYyl6criC5jP5sUoUV}
      organisation-id: ${ONEKHUSA_ORGANISATION_ID:TUWT67VBHONB}
      merchant-account-number: ${ONEKHUSA_MERCHANT_ACCOUNT_NUMBER:76684641}
      webhook-secret: ${ONEKHUSA_WEBHOOK_SECRET:}
      captured-by: ${ONEKHUSA_CAPTURED_BY:salvation.developer@gmail.com}
    paychangu:
      enabled: false
      environment: sandbox
      base-url: ${PAYCHANGU_BASE_URL:https://api.paychangu.com}
      secret-key: ${PAYCHANGU_SECRET_KEY:}
      webhook-secret: ${PAYCHANGU_WEBHOOK_SECRET:}
      callback-url: ${PAYCHANGU_CALLBACK_URL:}
      return-url: ${PAYCHANGU_RETURN_URL:}
      customization-title: ${PAYCHANGU_CUSTOMIZATION_TITLE:}

  reconciliation:
    # Periodic gateway status reconciliation: catches payments whose completion
    # webhook was missed, and auto-expires request-to-pays whose TAN lapsed.
    enabled: true
    interval-ms: 30000

logging:
  level:
    com.paymentgateway: INFO
    org.springframework.web: INFO
