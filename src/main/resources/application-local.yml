spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_gateway
    username: payment_gateway
    password: payment_gateway
    driver-class-name: org.postgresql.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true

logging:
  level:
    com.paymentgateway: DEBUG
    org.springframework.web: DEBUG
    org.flywaydb: DEBUG
